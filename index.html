<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TalkBridge - English Added</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            background: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--text);
        }

        .screen {
            height: 50%;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-sizing: border-box;
            position: relative;
        }

        .player-inverted {
            transform: rotate(180deg);
            border-bottom: 2px solid #334155;
        }

        .divider {
            height: 4px;
            background: var(--accent);
            width: 100%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .lang-selector {
            position: absolute;
            top: 15px; right: 15px;
            z-index: 30;
        }

        select {
            background: #0f172a; color: white; border: 1px solid var(--accent);
            padding: 8px; border-radius: 8px; font-size: 0.85rem; outline: none;
        }

        .message-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
        }

        #text-a, #text-b {
            font-size: 1.3rem;
            line-height: 1.4;
            font-weight: 600;
            max-width: 90%;
        }

        .history {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 15px;
            opacity: 0.8;
            font-weight: 400;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        button {
            background: var(--card-color);
            border: 1px solid #334155;
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button:active {
            transform: scale(0.96);
            background: var(--accent);
            color: #0f172a;
        }

        [dir="rtl"] { direction: rtl; text-align: right; }
        [dir="ltr"] { direction: ltr; text-align: left; }
    </style>
</head>
<body>

    <div id="player-b" class="screen player-inverted">
        <div class="lang-selector">
            <select onchange="updateLang('B', this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="pl">Polski</option>
                <option value="prs">Dari (دری)</option>
                <option value="fas">Farsi (فارسی)</option>
            </select>
        </div>
        <div class="message-display">
            <div id="hist-b" class="history"></div>
            <div id="text-b">Waiting...</div>
        </div>
        <div id="opts-b" class="options-grid"></div>
    </div>

    <div class="divider"></div>

    <div id="player-a" class="screen">
        <div class="lang-selector">
            <select onchange="updateLang('A', this.value)">
                <option value="fr" selected>Français</option>
                <option value="en">English</option>
                <option value="pl">Polski</option>
                <option value="prs">Dari (دری)</option>
                <option value="fas">Farsi (فارسی)</option>
            </select>
        </div>
        <div class="message-display">
            <div id="hist-a" class="history"></div>
            <div id="text-a">Prêt ?</div>
        </div>
        <div id="opts-a" class="options-grid"></div>
    </div>

    <script>
        const data = {
            fr: {
                start: "Commencer la conversation",
                waiting: "En attente de l'autre...",
                s1: "Bonjour ! Enchanté de vous rencontrer. Comment allez-vous ?",
                b1_1: "Très bien merci ! Et vous, d'où venez-vous ?",
                b1_2: "Ça va, merci. Et vous, qu'est-ce qui vous amène ici ?",
                b1_3: "Je suis un peu pressé. On fait court ? Que voulez-vous ?",
                a2: "Je viens d'une autre ville. Et vous, habitez-vous ici ?",
                b2_1: "J'habite ici, j'adore ce coin ! Vous voulez visiter ?",
                b2_2: "Je suis de passage. Connaissez-vous du monde ?",
                b2_3: "Je ne suis pas d'ici. Avez-vous bientôt fini ?",
                end: "Merci pour cet échange ! Bonne journée."
            },
            en: {
                start: "Start Conversation",
                waiting: "Waiting for other person...",
                s1: "Hello! Nice to meet you. How are you doing?",
                b1_1: "Very well, thanks! And you, where are you from?",
                b1_2: "I'm okay, thanks. And you, what brings you here?",
                b1_3: "I'm in a bit of a hurry. Can we be quick? What's up?",
                a2: "I'm from another city. And you, do you live around here?",
                b2_1: "I live here, I love it! Want me to show you around?",
                b2_2: "Just passing through. Do you know anyone here?",
                b2_3: "I'm not from here. Are you almost done?",
                end: "Thanks for the chat! Have a great day."
            },
            pl: {
                start: "Rozpocznij rozmowę",
                waiting: "Oczekiwanie na drugą osobę...",
                s1: "Dzień dobry! Miło Cię poznać. Jak się masz?",
                b1_1: "Bardzo dobrze, dziękuję! A Ty, skąd pochodzisz?",
                b1_2: "W porządku, dzięki. A Ty, co Cię tu sprowadza?",
                b1_3: "Trochę się spieszę. Streszczajmy się. O co chodzi?",
                a2: "Jestem z innego miasta. A Ty, mieszkasz tutaj?",
                b2_1: "Mieszkam tutaj, uwielbiam to miejsce! Chcesz zwiedzić?",
                b2_2: "Jestem przejazdem. Znasz tu kogoś?",
                b2_3: "Nie jestem stąd. Kończysz już?",
                end: "Dziękuję za rozmowę! Miłego dnia."
            },
            prs: {
                start: "شروع گفتگو",
                waiting: "در انتظار طرف مقابل...",
                s1: "سلام! از ملاقات شما خوشبختم. چطور هستید؟",
                b1_1: "بسیار خوب، تشکر! و شما از کجا هستید؟",
                b1_2: "خوبم، تشکر. و شما، چی باعث شده اینجا بیایید؟",
                b1_3: "کمی عجله دارم. کوتاه بگویم؟ چه می‌خواهید بدانید؟",
                a2: "من از شهر دیگری می‌آیم. و شما، اینجا زندگی می‌کنید؟",
                b2_1: "من اینجا زندگی می‌کنم، این منطقه را دوست دارم! بازدید؟",
                b2_2: "من رهگذر هستم. آیا کسی را اینجا می‌شناسید؟",
                b2_3: "من اهل اینجا نیستم. آیا کارتان تمام شده است؟",
                end: "ممنون از این گفتگو! روز خوش."
            },
            fas: {
                start: "شروع گفتگو",
                waiting: "در انتظار نفر مقابل...",
                s1: "سلام! از دیدنت خوشحالم. حال شما چطور است؟",
                b1_1: "خیلی خوب، ممنون! و شما، اهل کجا هستید؟",
                b1_2: "خوبم، ممنون. و شما، چه چیزی شما را به اینجا کشانده؟",
                b1_3: "کمی عجله دارم. کوتاه صحبت کنیم؟ چه می‌خواهید بدانید؟",
                a2: "من از شهر دیگری می‌آیم. و شما، ساکن اینجا هستید؟",
                b2_1: "من اینجا زندگی می‌کنم، عاشق این محله‌ام! بازدید؟",
                b2_2: "مسافر هستم. کسی را اینجا می‌شناسید؟",
                b2_3: "من اهل اینجا نیستم. آیا کارتان تمام شده است؟",
                end: "ممنون برای این گفتگو! روز خوبی داشته باشید."
            }
        };

        let state = {
            langA: 'fr',
            langB: 'en',
            step: 0, 
            turn: 'A',
            lastMsg: ''
        };

        function updateLang(p, l) {
            if(p==='A') state.langA = l; else state.langB = l;
            render();
        }

        function render() {
            const ui = {
                textA: document.getElementById('text-a'),
                optsA: document.getElementById('opts-a'),
                histA: document.getElementById('hist-a'),
                textB: document.getElementById('text-b'),
                optsB: document.getElementById('opts-b'),
                histB: document.getElementById('hist-b'),
                scrA: document.getElementById('player-a'),
                scrB: document.getElementById('player-b')
            };

            ui.optsA.innerHTML = ''; ui.optsB.innerHTML = '';
            ui.scrA.dir = (state.langA === 'prs' || state.langA === 'fas') ? 'rtl' : 'ltr';
            ui.scrB.dir = (state.langB === 'prs' || state.langB === 'fas') ? 'rtl' : 'ltr';

            if (state.step === 0) {
                ui.textA.innerText = "TalkBridge";
                createBtn(ui.optsA, data[state.langA].start, () => {
                    state.step = 1; state.turn = 'B'; state.lastMsg = 's1'; render();
                });
                ui.textB.innerText = "Select language ↑";
            } 
            
            else if (state.turn === 'B') {
                ui.histA.innerText = "✓ Sent";
                ui.textA.innerText = data[state.langA].waiting;
                ui.histB.innerText = "";
                ui.textB.innerText = data[state.langB][state.lastMsg];
                
                const choices = (state.step === 1) ? ['b1_1', 'b1_2', 'b1_3'] : ['b2_1', 'b2_2', 'b2_3'];
                choices.forEach(key => {
                    createBtn(ui.optsB, data[state.langB][key], () => {
                        state.lastMsg = key; state.turn = 'A'; state.step++; render();
                    });
                });
            }

            else if (state.turn === 'A') {
                ui.histB.innerText = "✓ Sent";
                ui.textB.innerText = data[state.langB].waiting;
                ui.histA.innerText = "";
                ui.textA.innerText = data[state.langA][state.lastMsg];

                if (state.step === 2) {
                    createBtn(ui.optsA, data[state.langA].a2, () => {
                        state.lastMsg = 'a2'; state.turn = 'B'; render();
                    });
                } else {
                    ui.textA.innerText = data[state.langA].end;
                    ui.textB.innerText = data[state.langB].end;
                }
            }
        }

        function createBtn(parent, text, cb) {
            const b = document.createElement('button');
            b.innerText = text;
            b.onclick = cb;
            parent.appendChild(b);
        }

        render();
    </script>
</body>
</html>
